aid: doinstruct
name: doinstruct
description: 'doinstruct is an AI-powered frontline training and compliance platform for deskless
  and shift-based workforces. Founded in Osnabrück, Germany in 2021 and now headquartered in Brooklyn,
  New York with an office in Berlin, it turns internal SOPs, documents, and expert knowledge into
  mobile-first courses delivered in 35+ languages. Its Genius AI authoring tool, a 400+ lesson training
  library, a manager dashboard for assigning and documenting training, and a mobile learner experience
  serve 400+ frontline teams across food & beverage, logistics, manufacturing, construction, and
  general compliance, with audit-ready reporting for standards such as HACCP, GFSI, and ISO 27001.
  Backed by Creandum and HV Capital.'
